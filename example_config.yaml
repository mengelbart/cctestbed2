name: example
duration: 12
network:
  - traffic_control: true
    bandwidth: 1mbit
    limit: 12500
    burst: 6250
    delay: 100000
    duration: 12
applications:
  - name: server
    namespace: ns1
    start_time: 0
    duration: 12
    environment: []
    binary: iperf3
    arguments:
      - '-s'
      - '--logfile'
      - 'server.log'
  - name: client
    namespace: ns4
    start_time: 1
    duration: 10
    environment: []
    binary: iperf3
    arguments:
      - '-c'
      - '10.0.12.1'
      - '--logfile'
      - 'client.log'
      - '-i'
      - '0.1'
      - '-u'
      - '-b'
      - '1M'
